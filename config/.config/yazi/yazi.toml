[opener]
edit = [{ run = "kitty -e nvim %s", orphan = true, for = "unix" }]
play = [{ run = "mpv %s", orphan = true, for = "unix" }]
pdf_viewer = [{ run = "zathura %s", orphan = true, for = "unix" }]

[open]
prepend_rules = [
  { url = "*.json", use = "edit" },
  { url = "*.html", use = "edit" },
  { url = "*.pdf", use = "pdf_viewer" },
]
