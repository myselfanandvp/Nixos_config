# ============================================================
# MangoWM Keybindings
# Vim-style Layout (No Duplicate Keybindings)
# ============================================================

# ------------------------------------------------------------
# Reload
# ------------------------------------------------------------
bind=SUPER,r,reload_config

# ------------------------------------------------------------
# Applications
# ------------------------------------------------------------
bind=SUPER,Return,spawn,kitty
bind=ALT,Return,spawn,ghostty
bind=SUPER,N,spawn,noctalia msg panel-toggle noctalia/notes:panel

bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,s,spawn,noctalia msg panel-toggle control-center
bind=SUPER,w,spawn,noctalia msg panel-toggle wallpaper
bind=SUPER,x,spawn,noctalia msg panel-toggle session
bind=SUPER,comma,spawn,noctalia msg settings-toggle

# Media Keys
bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bind=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bind=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down

# Layout Selection
bind=SUPER+CTRL,s,setlayout,scroller
bind=SUPER+CTRL,v,setlayout,vertical_scroller
bind=SUPER+CTRL,d,setlayout,dwindle
bind=SUPER+CTRL,g,setlayout,grid

# Custom Scripts
bind=SUPER+ALT,e,spawn,sh -c "~/.config/mango/scripts/gui_filemanager.sh"
bind=SUPER,e,spawn,sh -c "~/.config/mango/scripts/yazi.sh"
bind=SUPER,b,spawn,sh -c "~/.config/mango/scripts/btop_toggle.sh"
bind=SUPER,t,spawn,sh -c "~/.config/mango/scripts/kitty_toggle.sh"

# Screenshot
bind=SUPER,p,spawn_shell,g=$(slurp -d) && [ -n "$g" ] && grim -g "$g" $HOME/Pictures/Screenshots/$(date +%Y%m%d%H%M%S).png && notify-send "Screenshot Captured" "Saved to your Screenshots folder." -i camera

# ------------------------------------------------------------
# Session
# ------------------------------------------------------------
bind=SUPER,m,quit
bind=SUPER,q,killclient

# ------------------------------------------------------------
# Window Focus
# ------------------------------------------------------------

# Vim Keys
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right

# Arrow Keys
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# ------------------------------------------------------------
# Window Swap
# ------------------------------------------------------------

# Vim Keys
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right

# Arrow Keys
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

# ------------------------------------------------------------
# Window States
# ------------------------------------------------------------
bind=SUPER,g,toggleglobal
bind=SUPER,Tab,toggleoverview
bind=SUPER,v,togglefloating
bind=SUPER,f,togglemaximizescreen
bind=ALT,f,togglefakefullscreen
bind=ALT+SHIFT,f,togglefullscreen
bind=SUPER,i,minimized
bind=SUPER,o,toggleoverlay
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# ------------------------------------------------------------
# Scroller
# ------------------------------------------------------------
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset

# ------------------------------------------------------------
# Layout
# ------------------------------------------------------------
bind=SUPER,n,switch_layout

# ------------------------------------------------------------
# Workspace / Tags
# ------------------------------------------------------------

# Switch Workspaces
bind=ALT,Left,viewtoleft,0
bind=ALT,Right,viewtoright,0

# Switch to Workspace with Clients
bind=CTRL,Left,viewtoleft_have_client,0
bind=CTRL,Right,viewtoright_have_client,0

# Move Workspace
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

# Direct Workspace Access
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# Move Window to Workspace
bind=ALT,1,tag,1,0
bind=ALT,2,tag,2,0
bind=ALT,3,tag,3,0
bind=ALT,4,tag,4,0
bind=ALT,5,tag,5,0
bind=ALT,6,tag,6,0
bind=ALT,7,tag,7,0
bind=ALT,8,tag,8,0
bind=ALT,9,tag,9,0

# ------------------------------------------------------------
# Multi-Monitor (Vim Style)
# ------------------------------------------------------------

# Focus Monitor
bind=SUPER+ALT,h,focusmon,left
bind=SUPER+ALT,l,focusmon,right

# Move Current Window to Monitor
bind=SUPER+CTRL,h,tagmon,left
bind=SUPER+CTRL,l,tagmon,right

# Optional: Cycle Through Monitors
bind=ALT,Tab,focusmon,right

# ------------------------------------------------------------
# Gaps
# ------------------------------------------------------------
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# ------------------------------------------------------------
# Floating Window Move
# ------------------------------------------------------------
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# ------------------------------------------------------------
# Floating Window Resize
# ------------------------------------------------------------

# Vertical Resize
bind=SUPER,bracketright,resizewin,+0,-50
bind=SUPER,bracketleft,resizewin,+0,+50

# Horizontal Resize
bind=CTRL+ALT,bracketright,resizewin,+50,+0
bind=CTRL+ALT,bracketleft,resizewin,-50,+0

# ------------------------------------------------------------
# Mouse Bindings
# ------------------------------------------------------------
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,togglemaximizescreen

# Mouse Navigation
mousebind=SUPER,btn_back,focusstack,-1
mousebind=SUPER,btn_forward,focusstack,1

# Mouse Wheel Navigation
axisbind=SUPER,UP,focusstack,-1
axisbind=SUPER,DOWN,focusstack,1
axisbind=SUPER,LEFT,focusstack,-1
axisbind=SUPER,RIGHT,focusstack,1
