# ==========================================
# MONITOR CONFIGURATION
# ==========================================

# Laptop Screen (Primary Display)
# 1080p, placed at the origin (0,0)
monitorrule=name:eDP-1,width:1920,height:1080,refresh:60,x:0,y:0,scale:1.0,vrr:0

# External Monitor (Placed to the right of the laptop)
# 768p, offset by 1920 pixels on the X-axis
monitorrule=name:HDMI-A-1,width:1366,height:768,refresh:60,x:1920,y:0,scale:1.0,vrr:0

# ==========================================
# CROSS-MONITOR BEHAVIOR (Optimised)
# ==========================================
focus_cross_monitor=1
exchange_cross_monitor=1
scratchpad_cross_monitor=1
