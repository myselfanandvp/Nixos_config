# ==========================================
# Input & Device Configuration
# ==========================================
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us

# ==========================================
# Trackpad Settings (Optimized Speed & Gestures)
# ==========================================
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# Trackpad Speed & Acceleration Adjustments
# 2 = Adaptive profile (smooth acceleration as you move faster)
trackpad_accel_profile=2
# Increase pointer speed (Ranges from -1.0 to 1.0; 0.4 provides a brisk, responsive feel)
trackpad_accel_speed=0.4

# ==========================================
# Mouse & Cursor Settings
# ==========================================
mouse_natural_scrolling=0
cursor_size=18
