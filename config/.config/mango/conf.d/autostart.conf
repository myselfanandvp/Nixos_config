# Start the Noctalia shell/bar
exec-once = noctalia

# Terminate any lingering portal instances to avoid conflicts
exec-once = systemctl --user stop xdg-desktop-portal
exec-once = systemctl --user stop xdg-desktop-portal-wlr
exec-once = systemctl --user stop xdg-desktop-portal-hyprland
exec-once = systemctl --user stop xdg-desktop-portal-gnome

# Start the required modern XDG desktop portals sequentially
exec-once = /usr/lib/xdg-desktop-portal-wlr &
