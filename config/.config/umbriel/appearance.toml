[colors]
background = "#11131BFF"
text_primary = "#F2F4FCFF"
text_muted = "#A6ADC8FF"
accent_primary = "#7AA2F7FF"
accent_secondary = "#BB9AF7FF"
warning = "#E0AF68FF"
error = "#F7768EFF"
insert_hint = "#7DCFFFFF"
backdrop = "#0B0D14FF"
shadow = "#080A12A8"

[colors.border]
focused = "#7AA2F7FF"
unfocused = "#343A52FF"
outer = "#BB9AF7FF"

[colors.overview]
background_tint = "#11131B66"
workspace_background = "#1A1D2A99"
badge = "#7DCFFFFF"

[colors.tab_bar]
background = "#202435F2"
text = "#A6ADC8FF"
active = "#7AA2F7FF"
active_text = "#11131BFF"
active_unfocused = "#3B4261FF"
active_unfocused_text = "#F2F4FCFF"
urgent = "#F7768EFF"
urgent_text = "#11131BFF"

[appearance]
prefer_no_csd = true
border_width = 2
outer_border_width = 0
corner_radius = 0
drag_opacity = 0.80
opaque_fullscreen = true

[appearance.tab_bar]
style = "titles"
position = "top"
height = 26
font = "sans 10"
padding = 9
tab_gap = 3
corner_radius = 8
title_format = "{title}"
title_align = "center"
visible = true
hide_when_single = true
max_tabs = 6
overflow = "scroll"

[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 8
noise = 0.015
brightness = 0.92
contrast = 1.02
saturation = 1.15

[appearance.shadow]
enabled = true
softness = 14
offset_x = 0
offset_y = 4
