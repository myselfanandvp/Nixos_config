config_version = 20

[bar.default]
center = [ "clock", "widget" ]

[dock]
pinned = [ "kitty", "floorp", "brave-browser" ]

[plugins]
enabled = [ "noctalia/notes" ]

[shell.launcher]
pinned = []

[theme]
builtin = "Kanagawa"
community_palette = "GitHub Dark"
mode = "dark"
source = "community"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "ghostty", "helix", "hyprland", "kcolorscheme", "kitty", "qt", "wezterm" ]
    community_ids = [ "brave", "telegram", "fastfetch", "zathura", "papirus-icons", "herdr", "yazi" ]

[wallpaper.default]
path = "/home/anand/Pictures/Wallpapers/minimalist-1969-ford-mustang-mach-1-black-front-view-desktop-wallpaper-variant_1k.jpg"

[wallpaper.last]
path = "/home/anand/Pictures/Wallpapers/minimalist-1969-ford-mustang-mach-1-black-front-view-desktop-wallpaper-variant_1k.jpg"

[wallpaper.monitors.HDMI-A-1]
path = "/home/anand/Pictures/Wallpapers/minimalist-1969-ford-mustang-mach-1-black-front-view-desktop-wallpaper-variant_1k.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/anand/Pictures/Wallpapers/minimalist-1969-ford-mustang-mach-1-black-front-view-desktop-wallpaper-variant_1k.jpg"

[widget.widget]
type = "amaurisd97/screen-capture:widget"