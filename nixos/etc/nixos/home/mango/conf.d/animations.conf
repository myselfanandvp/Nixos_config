# --- General Animation Switches ---
animations=1
layer_animations=1

# --- Animation Types ---
# Using 'slide' for smooth, low-overhead transition performance
animation_type_open=slide
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide

# --- Fade Effects (1 = Enable) ---
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1

# --- Zoom Ratios (Fallback if zoom is used elsewhere) ---
zoom_initial_ratio=0.5
zoom_end_ratio=0.9

# --- Opacity Transitions ---
fadein_begin_opacity=0.6
fadeout_begin_opacity=0.85

# --- Durations (Optimized for Ryzen 3: Snappy yet fluid) ---
animation_duration_move=350
animation_duration_open=300
animation_duration_tag=250
animation_duration_close=250
animation_duration_focus=0

# --- Smooth Bezier Curves (Organic & Lightweight) ---
animation_curve_open=0.16, 1.0, 0.3, 1.0
animation_curve_move=0.16, 1.0, 0.3, 1.0
animation_curve_tag=0.16, 1.0, 0.3, 1.0
animation_curve_close=0.4, 0.0, 1.0, 1  
animation_curve_focus=0.16, 1.0, 0.3, 1.0
animation_curve_opafadeout=0.3, 0.0, 0.8, 0.15
animation_curve_opafadein=0.16, 1.0, 0.3, 1.0
