# ==========================================
# Tag Layouts
# ==========================================
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller

# ==========================================
# View Tags Bindings
# ==========================================
bind=Ctrl,1,view,1,0
bind=Ctrl,2,view,2,0
bind=Ctrl,3,view,3,0

# ==========================================
# Layer Rules (Optimized for Rofi/Launchers)
# ==========================================
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi

# ==========================================
# Window Rules (Floating & Opacity presets)
# ==========================================
windowrule=appid:yazi-float,isfloating:1,width:1200,height:800
windowrule=appid:btop-float,isfloating:1,width:1200,height:800
windowrule=appid:float-term,isfloating:1,width:1200,height:800
windowrule=appid:org.gnome.Nautilus,isfloating:1,width:1200,height:800,focused_opacity:0.95,unfocused_opacity:0.85
# windowrule=appid:zed,focused_opacity:0.95,unfocused_opacity:0.85

# ==========================================
# Custom Scratchpad & App Bindings
# ==========================================
bind=alt,w,toggle_named_scratchpad,workfolio,none,st -c st-workfolio -e python -m workfolio
